<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestão Financeira</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f3e8ff; /* Fundo Lilás */
      color: #333;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Rodapé do TOPO (Maior) */
    .header-top {
      background-color: #2e1065; /* Roxo Escuro */
      color: #ffffff;
      padding: 20px 24px; /* Mais alto */
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-top h1 {
      font-size: 1.4rem;
      font-weight: 600;
    }

    .btn-salario {
      background-color: #7c3aed; /* Roxo Botão */
      color: #ffffff;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
      transition: background-color 0.2s;
    }

    .btn-salario:hover {
      background-color: #6d28d9;
    }

    /* Container Principal */
    .container {
      max-width: 1200px;
      margin: 24px auto;
      padding: 0 16px;
      flex: 1; /* Garante que o rodapé inferior fique no final da tela */
      width: 100%;
    }

    /* Grid dos 4 Blocos */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
    }

    /* Estilo Individual dos Blocos */
    .card {
      background-color: #ffffff;
      padding: 18px;
      border-radius: 8px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      border: 1px solid #e9d5ff;
    }

    .card span {
      display: block;
      font-size: 0.85rem;
      color: #6b21a8;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .card .value {
      font-size: 1.35rem;
      font-weight: 700;
      color: #2e1065;
    }

    .card.highlight .value {
      color: #16a34a;
    }

    /* Rodapé INFERIOR (Menor) */
    .footer-bottom {
      background-color: #1e1b4b; /* Roxo Mais Escuro */
      color: #c4b5fd;
      padding: 8px 24px; /* Menor que o do topo */
      text-align: center;
      font-size: 0.75rem;
    }
  </style>
</head>
<body>

  <!-- Rodapé Superior (Maior) -->
  <header class="header-top">
    <h1>Gestão Financeira</h1>
    <button class="btn-salario" onclick="alterarSalario()">Alterar Salário</button>
  </header>

  <!-- Conteúdo dos Blocos -->
  <main class="container">
    <div class="cards-grid">
      
      <div class="card highlight">
        <span>Salário</span>
        <div class="value" id="val-salario">R$ 0,00</div>
      </div>

      <div class="card highlight">
        <span>Saldo Atual</span>
        <div class="value" id="val-saldo">R$ 0,00</div>
      </div>

      <div class="card">
        <span>Contas a Pagar</span>
        <div class="value" id="val-contas">R$ 0,00</div>
      </div>

      <div class="card">
        <span>Compras Realizadas</span>
        <div class="value" id="val-compras">R$ 0,00</div>
      </div>

    </div>
  </main>

  <!-- Rodapé Inferior (Menor) -->
  <footer class="footer-bottom">
    <span>&copy; Todos os direitos reservados.</span>
  </footer>

  <script>
    let salarioAtual = 0;

    function formatarMoeda(valor) {
      return valor.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }

    function alterarSalario() {
      const entrada = prompt("Digite o novo valor do salário (ex: 2500):");
      
      if (entrada !== null && entrada.trim() !== "") {
        const valorNumerico = parseFloat(entrada.replace(',', '.'));
        
        if (!isNaN(valorNumerico) && valorNumerico >= 0) {
          salarioAtual = valorNumerico;
          
          // Atualiza os cards na tela
          document.getElementById('val-salario').innerText = formatarMoeda(salarioAtual);
          document.getElementById('val-saldo').innerText = formatarMoeda(salarioAtual);
        } else {
          alert("Por favor, digite um número válido.");
        }
      }
    }
  </script>

</body>
</html>
